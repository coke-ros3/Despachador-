<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bomberos NI">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/784/784115.png">
    <link rel="manifest" href="manifest_voluntarios.json">

    <title>Alertas Bomberos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="voluntarios-body">

    <!-- VISTA 1: FEED DE EMERGENCIAS -->
    <div id="view-feed" class="vol-view">
        <div class="ios-nav-dark">
            <button class="ios-nav-btn-dark" onclick="window.location.href='index.html'"><span>❮</span> Canales</button>
            <div class="ios-nav-title-dark">Bomberos Nva. Imperial</div>
            <button class="ios-nav-btn-dark" id="btn-activar-notif" onclick="activarNotificaciones()" style="font-size: 1.3rem;">🔊</button>
        </div>
        
        <div class="vol-view-content">
            <!-- Píldoras de filtro tipo iOS -->
            <div class="feed-filters">
                <button class="filter-pill active">Todos</button>
                <button class="filter-pill">Hoy</button>
                <button class="filter-pill">No leídos</button>
                <button class="filter-icon-btn">≡</button>
            </div>

            <div id="emergencies-list" style="padding-bottom: 30px;">
                <div style="padding: 20px; text-align: center; color: #8E8E93;">Cargando emergencias...</div>
            </div>
        </div>
    </div>

    <!-- VISTA 2: DETALLE DE LA EMERGENCIA -->
    <div id="view-detail" class="vol-view" style="transform: translateX(100%);">
        <div class="ios-nav-dark">
            <button class="ios-nav-btn-dark" onclick="cerrarDetalle()"><span>❮</span> Atrás</button>
            <div class="ios-nav-title-dark">Notificación</div>
            <button class="ios-nav-btn-dark" style="font-size: 1.2rem;">🔔</button>
        </div>

        <div class="vol-view-content" style="display: flex; flex-direction: column; padding: 15px;">
            
            <!-- Cabecera -->
            <div class="det-header-modern">
                <img src="https://cdn-icons-png.flaticon.com/512/784/784115.png" alt="Escudo" width="45">
                <h2>Bomberos Nueva Imperial</h2>
                <p>Despacho de Emergencia</p>
            </div>

            <!-- Banner Azul -->
            <div class="det-blue-banner">
                <div class="banner-left">
                    <span class="banner-clave" id="det-clave">10-0</span>
                    <span class="banner-dir" id="det-dir">DIRECCIÓN</span>
                </div>
                <div class="banner-right" id="det-banner-units">
                    B-1
                </div>
            </div>

            <!-- Bloque Observaciones -->
            <div class="det-card-block">
                <div class="det-card-title">
                    <span>📋</span> Observaciones
                </div>
                <div class="det-card-content" id="det-obs">
                    Sin observaciones al despacho.
                </div>
                <div id="det-atentado" style="color: #D32F2F; font-weight: bold; font-size: 0.85rem; margin-top: 10px; display: none;">
                    ¡DESPACHADO COMO POSIBLE ATENTADO!
                </div>
            </div>

            <!-- Bloque Unidades Despachadas (Simplificado sin iconos complejos) -->
            <div class="det-card-block">
                <div class="det-card-title" style="font-size: 0.85rem; color: #8E8E93; margin-bottom: 10px;">
                    Unidades despachadas
                </div>
                <div class="det-units-grid" id="det-units">
                    <!-- Se inyecta por JS -->
                </div>
            </div>

            <!-- Botones Mapa -->
            <div class="map-buttons-row-modern">
                <button class="btn-map-modern" id="btn-waze">
                    <span style="font-size: 1.2rem;">📍</span><br>Waze
                </button>
                <button class="btn-map-modern" id="btn-gmaps">
                    <span style="font-size: 1.2rem;">🗺️</span><br>Google Maps
                </button>
                <button class="btn-map-modern" id="btn-amaps">
                    <span style="font-size: 1.2rem;">🧭</span><br>Apple Maps
                </button>
            </div>

            <!-- Mapa -->
            <div class="map-box-modern">
                <div id="map-voluntarios"></div>
            </div>

            <!-- Footer flotante de tiempo -->
            <div class="det-footer-pill">
                <span>🕒</span> <span id="det-footer-time"></span>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-NIM0pbgU2w85mWFhqUEkbA3L0_NrimI",
            authDomain: "despachador-58fb8.firebaseapp.com",
            projectId: "despachador-58fb8",
            storageBucket: "despachador-58fb8.firebasestorage.app",
            messagingSenderId: "1024295745401",
            appId: "1:1024295745401:web:8d49683a86a8b1ff7aa1a8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        // Activar Push
        window.activarNotificaciones = async function() {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const currentToken = await getToken(messaging, { vapidKey: 'BJAd0EQok-Gy4tA4ZkpvXinuLauwqk6cT70j-64zaFEj5tIgp2wLc81MFiN6tc_aspi2-TAiBoYkKJzozIAxcaw' });
                    if (currentToken) {
                        await setDoc(doc(db, "tokens_voluntarios", currentToken), { token: currentToken, plataforma: navigator.userAgent, fecha_registro: Date.now() });
                        document.getElementById('btn-activar-notif').innerText = '🔔';
                        alert("¡Alertas activadas!");
                    }
                }
            } catch (error) {
                console.error("Error activando push:", error);
            }
        };

        onMessage(messaging, (payload) => { alert(`🚨 ${payload.notification.title}\n${payload.notification.body}`); });

        let map = null;
        let pin = null;

        // Función para dar color a la línea de la tarjeta según la clave
        function getBorderColor(code) {
            if (code.startsWith('10-0')) return '#FFD60A'; // Amarillo fuego estructural
            if (code.startsWith('10-15')) return '#0A84FF'; // Azul simulacros/otros
            if (code.startsWith('10-2')) return '#30D158'; // Verde pastizales
            if (code.startsWith('10-4') || code.startsWith('10-3')) return '#FF453A'; // Rojo rescate/accidente
            return '#8E8E93'; // Gris por defecto
        }

        const q = query(collection(db, "emergencias_activas"), orderBy("timestamp", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const listContainer = document.getElementById('emergencies-list');
            listContainer.innerHTML = '';
            
            if (snapshot.empty) {
                listContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: #8E8E93;">No hay emergencias en curso.</div>';
                return;
            }

            snapshot.forEach(doc => {
                const em = doc.data();
                
                // Formateo de fecha tipo "01 ago 2026 00:10:35"
                let dateObj = em.timestamp ? em.timestamp.toDate() : new Date();
                const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
                const timeStr = dateObj.toLocaleDateString('es-ES', options).replace(',', '');
                
                const unitsStr = (em.units || []).join(', ');
                const borderColor = getBorderColor(em.code);
                
                let item = document.createElement('div');
                item.className = 'ios-card-feed';
                item.style.borderLeft = `4px solid ${borderColor}`;
                item.onclick = () => abrirDetalle(em);
                
                item.innerHTML = `
                    <div class="card-feed-header">
                        <span class="card-feed-dot" style="background-color: ${borderColor}"></span>
                        <span class="card-feed-date">${timeStr}</span>
                    </div>
                    <div class="card-feed-body">
                        <div class="card-feed-title">${em.code} ${em.address}</div>
                        <span class="card-feed-arrow">›</span>
                    </div>
                    <div class="card-feed-units">
                        🚒 ${unitsStr}
                    </div>
                `;
                listContainer.appendChild(item);
            });
        });

        window.abrirDetalle = function(em) {
            document.getElementById('view-feed').style.transform = 'translateX(-100%)';
            document.getElementById('view-detail').style.transform = 'translateX(0)';

            // Setear Banner Azul
            document.getElementById('det-clave').innerText = em.code;
            document.getElementById('det-dir').innerText = em.address;
            document.getElementById('det-banner-units').innerText = (em.units || []).join(', ');

            // Observaciones
            document.getElementById('det-obs').innerText = em.obs || 'Sin observaciones al despacho.';
            
            const txtAtentado = document.getElementById('det-atentado');
            if (em.isAtentado) { txtAtentado.style.display = 'block'; } else { txtAtentado.style.display = 'none'; }

            // Fecha Footer
            let dateObj = em.timestamp ? em.timestamp.toDate() : new Date();
            const options = { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('det-footer-time').innerText = dateObj.toLocaleDateString('es-ES', options).replace(',', ' • ');

            // Unidades (Diseño simple sin camiones grandes)
            const unitsContainer = document.getElementById('det-units');
            unitsContainer.innerHTML = '';
            (em.units || []).forEach(u => {
                let badge = document.createElement('div');
                badge.className = 'unit-pill-simple';
                badge.innerHTML = `<span style="font-size:1.2rem; margin-right:5px;">🚒</span> <b>${u}</b>`;
                unitsContainer.appendChild(badge);
            });

            // Mapas
            let lat = em.markerLatLng ? em.markerLatLng.lat : -38.7446590;
            let lng = em.markerLatLng ? em.markerLatLng.lng : -72.9521597;

            document.getElementById('btn-waze').onclick = () => { window.location.href = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`; };
            document.getElementById('btn-gmaps').onclick = () => { window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`; };
            document.getElementById('btn-amaps').onclick = () => { window.location.href = `http://maps.apple.com/?daddr=${lat},${lng}`; };

            setTimeout(() => {
                if (!map) {
                    map = L.map('map-voluntarios', { zoomControl: false });
                    L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/{z}/{x}/{y}?access_token=pk.eyJ1Ijoiam9yZ2VsYW5kZXIiLCJhIjoiY21yazBmNngzMDBiNDJ5b2pkMjF3dHljbCJ9.cbcHOpTihe9Y-9l6HZHjAw', { maxZoom: 19 }).addTo(map);
                }
                map.setView([lat, lng], 16);
                if (pin) map.removeLayer(pin);
                pin = L.marker([lat, lng], {
                    icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png', iconSize: [25, 41], iconAnchor: [12, 41] })
                }).addTo(map);
                map.invalidateSize();
            }, 350);
        };

        window.cerrarDetalle = function() {
            document.getElementById('view-detail').style.transform = 'translateX(100%)';
            document.getElementById('view-feed').style.transform = 'translateX(0)';
        };
    </script>
</body>
</html>
